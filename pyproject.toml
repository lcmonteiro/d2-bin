[project]
name = "d2-bin"
version = "0.7.1"
description = "The official D2 diagram binary (d2lang.com), packaged as Python wheels for pip and uv"
readme = "README.md"
authors = [{ name = "lcmonteiro", email = "monteiro.lcm@gmail.com" }]
license = "MIT AND MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["d2", "diagrams", "d2lang", "svg", "binary"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/lcmonteiro/d2-bin"
Issues = "https://github.com/lcmonteiro/d2-bin/issues"
D2 = "https://d2lang.com"

[project.scripts]
d2 = "d2_bin.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2_bin"]
# The binary and D2's license are added per platform by hatch_build.py, never from the source tree.
exclude = ["src/d2_bin/bin"]

[tool.hatch.build.targets.sdist]
include = ["src/d2_bin", "hatch_build.py", "README.md", "LICENSE", "tests", "scripts"]
exclude = ["src/d2_bin/bin"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest>=8", "hatchling>=1.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
